name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          CI: "true"
          # A push checkout is detached, so name the branch the way Workers Builds does.
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
