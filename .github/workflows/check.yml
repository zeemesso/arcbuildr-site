name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          CI: "true"
          # A push checkout is detached, so name the branch the way Workers Builds does.
          # On main the name is "ci-main": the browser tests need a preview build (the toolbar, the
          # demo pages, the draft magnet). The main build has its own check, test:main-build.
          WORKERS_CI_BRANCH: ${{ github.ref_name == 'main' && 'ci-main' || github.ref_name }}
